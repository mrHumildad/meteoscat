# Builds the app and deploys it to GitHub Pages on every push to main.
#
# The daily meteo data is NOT built here: it lives in the separate cepdata
# repo, which commits and publishes it on its own schedule. A data refresh
# therefore never triggers a client rebuild — only a change to this repo's
# code does. The app reads the data at runtime from VITE_DATA_BASE_URL, which
# comes from the committed .env.
#
# Do NOT pass VITE_DATA_BASE_URL through `env:` here. An undefined repo
# variable expands to an empty string, and an empty value overrides .env — the
# build then silently falls back to same-origin /logic/daily/, which no longer
# exists in this repo and 404s in production. To retarget the data site, edit
# .env (it is committed) and let this workflow pick it up.
#
# Requires GitHub Pages enabled in the repo with the source set to
# "GitHub Actions" (Settings → Pages).

name: deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Reads VITE_DATA_BASE_URL from the committed .env — see the header
        # comment before wiring this to a repo variable.
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
