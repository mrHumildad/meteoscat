# Builds the app and deploys it to GitHub Pages on every push to main.
#
# The daily meteo data is NOT built here: it lives in the separate
# meteoscat-server repo, which commits and publishes it on its own schedule.
# A data refresh therefore never triggers a client rebuild — only a change to
# this repo's code does. The app reads the data at runtime from
# VITE_DATA_BASE_URL (committed in .env, overridable via the repo variable
# below).
#
# Requires GitHub Pages enabled in the repo with the source set to
# "GitHub Actions" (Settings → Pages).

name: deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # vars.VITE_DATA_BASE_URL lets you retarget the data site without a
        # code change; .env's value is used when the variable is unset.
        env:
          VITE_DATA_BASE_URL: ${{ vars.VITE_DATA_BASE_URL }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
